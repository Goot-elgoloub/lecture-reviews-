name: Update lecture index

on:
  push:
    branches: [main]
    paths-ignore:
      - data.json

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate data.json
        run: |
          python3 - <<'EOF'
          import json, os

          slugs = [
              "web-engineering",
              "information-security",
              "algorithms",
              "software-testing",
              "data-mining",
              "entrepreneurship",
          ]

          data = {}
          for slug in slugs:
              if os.path.isdir(slug):
                  files = sorted(
                      f for f in os.listdir(slug)
                      if f.lower().endswith((".html", ".htm"))
                  )
              else:
                  files = []
              data[slug] = files

          with open("data.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          EOF

      - name: Commit updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Update lecture index [auto]"
          git push
